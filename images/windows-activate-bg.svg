<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Windows activation preview</title>
  <desc id="desc">A blue Windows-inspired activation screen with a glowing window and taskbar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d2f5e"/>
      <stop offset="45%" stop-color="#0e3d77"/>
      <stop offset="100%" stop-color="#0a2241"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d8efff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d8f4ff" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#9fe1ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9fe1ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <g opacity="0.8">
    <rect x="594" y="98" width="370" height="240" rx="8" fill="#0e5c9f" opacity="0.22"/>
    <rect x="610" y="110" width="338" height="214" rx="7" fill="url(#glass)" stroke="#d4f4ff" stroke-opacity="0.42"/>
    <path d="M635 350 L973 350" stroke="#d4f4ff" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M628 120 L947 120" stroke="#d4f4ff" stroke-opacity="0.52" stroke-width="2"/>
  </g>

  <g filter="url(#softGlow)">
    <path d="M640 120 L948 120 L948 350 L690 350 L640 120Z" fill="rgba(200,240,255,0.12)"/>
    <rect x="640" y="120" width="308" height="230" fill="none" stroke="#bfe8ff" stroke-opacity="0.85" stroke-width="2"/>
    <path d="M624 150 L780 150" stroke="#e2f8ff" stroke-opacity="0.75" stroke-width="5"/>
    <path d="M710 96 L710 380" stroke="#bfe8ff" stroke-opacity="0.6" stroke-width="6"/>
    <path d="M702 96 L700 380" stroke="#dffaff" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <g>
    <path d="M775 118 L1430 118 L1430 700 L775 700Z" fill="url(#beam)" opacity="0.9"/>
    <path d="M628 720 L1353 720 L1353 610 L1020 423 L628 720Z" fill="url(#beam)" opacity="0.3"/>
  </g>

  <g opacity="0.9">
    <rect x="0" y="0" width="1280" height="720" fill="none" stroke="#000" stroke-width="4"/>
    <text x="640" y="390" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="56" fill="#edf7ff" font-weight="300" letter-spacing="0.5">Activate Windows</text>
    <text x="640" y="448" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" fill="#eaf5ff" fill-opacity="0.82" font-weight="300">Go to Settings to activate Windows.</text>
  </g>

  <g>
    <rect x="0" y="635" width="1280" height="85" fill="#0d0d0d" fill-opacity="0.62"/>
    <g transform="translate(24,642)">
      <rect x="0" y="8" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="72" y="6" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="144" y="6" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="216" y="8" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="288" y="6" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="358" y="8" width="42" height="42" rx="8" fill="#1c1c1c"/>
      <rect x="428" y="8" width="42" height="42" rx="8" fill="#3d7cf2"/>
    </g>

    <g transform="translate(850,650)" font-family="Segoe UI, Arial, sans-serif" fill="#edf7ff" font-size="22">
      <text x="0" y="0">9:38 PM</text>
      <text x="144" y="0">3/5/2016</text>
    </g>
  </g>
</svg>
