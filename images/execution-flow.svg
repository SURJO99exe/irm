<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" role="img" aria-labelledby="title desc">
  <title id="title">Execution flow screenshot</title>
  <desc id="desc">A stylized Windows desktop with a clipboard-style screenshot card showing a preview and action flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fb"/>
      <stop offset="100%" stop-color="#edf1f5"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eaf2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#9eb7d6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="860" height="520" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="72" width="720" height="350" rx="14" fill="#eaf3ff" stroke="#b8cfe7" stroke-width="2"/>

    <rect x="82" y="92" width="336" height="210" rx="10" fill="#0f4d9a"/>
    <rect x="96" y="106" width="308" height="182" rx="8" fill="#1b5bb0" opacity="0.45"/>

    <g opacity="0.88">
      <rect x="120" y="132" width="54" height="54" rx="10" fill="#dcecff" fill-opacity="0.18"/>
      <rect x="184" y="132" width="54" height="54" rx="10" fill="#dcecff" fill-opacity="0.18"/>
      <rect x="248" y="132" width="54" height="54" rx="10" fill="#dcecff" fill-opacity="0.18"/>
      <rect x="312" y="132" width="54" height="54" rx="10" fill="#dcecff" fill-opacity="0.18"/>
    </g>

    <g opacity="0.9">
      <rect x="108" y="214" width="170" height="34" rx="8" fill="#0d0d0d" fill-opacity="0.22"/>
      <text x="134" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fefefe" font-weight="700">Activate Windows</text>
      <text x="134" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#edf6ff" opacity="0.84">Go to Settings to activate Windows.</text>
    </g>

    <rect x="432" y="92" width="324" height="210" rx="10" fill="#edf4ff" stroke="#c6d8ef" stroke-width="2"/>
    <rect x="456" y="118" width="278" height="160" rx="8" fill="#0067d9" opacity="0.12"/>
    <g>
      <rect x="468" y="146" width="46" height="46" rx="8" fill="#0a82ff" opacity="0.9"/>
      <circle cx="484" cy="170" r="14" fill="#dff5ff" opacity="0.9"/>
      <path d="M470 188 L500 188" stroke="#dff5ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text x="530" y="165" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#0d2b4d">Screenshot 3</text>
    <text x="530" y="204" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4a6782">Preview item</text>
    <text x="530" y="236" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#4a6782">Status: Ready</text>

    <g>
      <rect x="96" y="335" width="660" height="62" rx="8" fill="#f8fbff" stroke="#cfe0f3" stroke-width="2"/>
      <rect x="116" y="352" width="142" height="28" rx="6" fill="#dbeeff"/>
      <rect x="280" y="352" width="142" height="28" rx="6" fill="#dbeeff"/>
      <rect x="444" y="352" width="142" height="28" rx="6" fill="#dbeeff"/>
      <rect x="608" y="352" width="120" height="28" rx="6" fill="#dbeeff"/>
    </g>
  </g>
</svg>
